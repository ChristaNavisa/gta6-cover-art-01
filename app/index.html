<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panel Studio — GTA 6 Cover Art</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>VICE PANEL STUDIO</h1>
    <p>Turn a photo and a caption into GTA 6-style cover art.</p>
  </div>
  <div class="heat" id="heat" title="Heat meter"></div>
</header>
<main id="editor">
  <section class="stage">
    <canvas id="preview" width="1080" height="1080"></canvas>
    <p class="hint">Drag a panel to pan it · click a panel to select it · scroll to zoom</p>
    <div id="selftest" aria-live="polite"></div>
  </section>
  <aside class="controls">
    <label class="field">Caption
      <input id="caption" type="text" value="NEON SHORE" maxlength="24" autocomplete="off">
    </label>
    <label class="field">Accent line
      <input id="subcaption" type="text" value="Vice City Nights" maxlength="40" autocomplete="off">
    </label>
    <fieldset class="field"><legend>Layout</legend>
      <div class="seg" id="layouts"></div>
    </fieldset>
    <fieldset class="field"><legend>Grade</legend>
      <div class="seg" id="grades"></div>
    </fieldset>
    <fieldset class="field"><legend>Post size</legend>
      <div class="seg" id="sizes"></div>
    </fieldset>
    <fieldset class="field"><legend>Heat</legend>
      <div class="stars" id="stars"></div>
    </fieldset>
    <fieldset class="field"><legend>Panels</legend>
      <div id="panels"></div>
      <label class="upload">+ Add your photo
        <input id="upload" type="file" accept="image/*" hidden>
      </label>
    </fieldset>
    <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
    <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
    <div class="row">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="export" type="button" class="primary">Export PNG</button>
    </div>
  </aside>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
